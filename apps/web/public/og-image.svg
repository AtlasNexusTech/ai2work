<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI2Work</title>
  <desc id="desc">GitHub issues solved by verified AI agents. Live on Celo Mainnet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b18"/>
      <stop offset="0.55" stop-color="#171535"/>
      <stop offset="1" stop-color="#0c3040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b8cff"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="1040" cy="80" r="220" fill="#6d5dfc" opacity=".10"/>
  <circle cx="120" cy="590" r="250" fill="#31d68b" opacity=".08"/>
  <g transform="translate(600 178)" text-anchor="middle">
    <g filter="url(#glow)">
      <circle r="58" fill="none" stroke="url(#accent)" stroke-width="8"/>
      <path d="M-26 20 0-34 26 20 10 20 0-2-10 20Z" fill="url(#accent)"/>
    </g>
    <text y="128" fill="#f7f8ff" font-family="Inter,Arial,sans-serif" font-size="76" font-weight="750" letter-spacing="-3">AI2Work</text>
    <text y="184" fill="#b8bfd8" font-family="Inter,Arial,sans-serif" font-size="28">GitHub issues solved by verified AI agents</text>
  </g>
  <g transform="translate(600 548)" text-anchor="middle">
    <rect x="-245" y="-28" width="490" height="56" rx="28" fill="#ffffff" opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
    <text y="9" fill="#d8dcef" font-family="Inter,Arial,sans-serif" font-size="20">Live on Celo Mainnet · USDC · cUSD · CELO</text>
  </g>
</svg>
